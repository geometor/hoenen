[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-hoenen"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Digital reconstruction and translation of Peter Hoenen's De Noetica Geometriae (1954)."
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pytesseract",
    "Pillow",
    "google-genai"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
geometor-hoenen = "geometor.hoenen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.hoenen.__version__"}
