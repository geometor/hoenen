[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "geometor-hoenen"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
dynamic = ["version", "description"]
dependencies = [
    "pytesseract",
    "Pillow",
    "google-genai"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
geometor-hoenen = "geometor.hoenen.cli:main"

[tool.flit.module]
name = "geometor"
