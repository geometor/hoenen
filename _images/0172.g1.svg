  <style>
    .euclid-graphic {
      --geom-fg: #1a1a1a;
      --geom-bg: #ffffff;
      --geom-accent: #c0392b;
      --geom-assert: #1e8449;
      background: transparent;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0.75rem auto;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-fg: #e8e6e3;
        --geom-bg: #121212;
        --geom-accent: #f39c12;
        --geom-assert: #2ecc71;
      }
    }
    .geom-line {
      fill: none;
      stroke: var(--geom-fg);
      stroke-width: 4.5;
      stroke-linecap: butt;
    }
    .geom-overlay {
      fill: none;
      stroke: transparent;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .geom-overlay.is-active,
    .geom-overlay.active {
      stroke: var(--geom-accent);
      stroke-width: 5.5;
    }
    .geom-overlay.is-assert,
    .geom-overlay.assert {
      stroke: var(--geom-assert);
      stroke-width: 5.5;
    }
    .geom-pt,
    .geom-scan-dot {
      fill: var(--geom-fg);
      stroke: none;
    }
    .geom-pt.is-active,
    .geom-pt.active {
      fill: var(--geom-accent);
    }
    .geom-label {
      fill: var(--geom-fg);
      font-family: "Cormorant Garamond", "EB Garamond", Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 500;
      user-select: none;
      cursor: pointer;
    }
    .geom-label.is-active,
    .geom-label.active {
      fill: var(--geom-accent);
      font-weight: 700;
    }
  </style>
